<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRRI-PILOT</title><link rel="stylesheet" href="css/style.css"></head><body><header><h1>IRRI-PILOT v0.1</h1><p>Pilotage de l'irrigation</p></header><main><nav><button onclick="show('dash')">Accueil</button><button onclick="show('config')">Configuration</button><button onclick="show('daily')">Données</button><button onclick="show('history')">Historique</button></nav><section id="dash"><h2>Tableau de bord</h2><div id="status"></div><div class="cards"><article>Parcelle<strong id="parcel">—</strong></article><article>Déficit<strong id="deficit">—</strong></article><article>RFU<strong id="rfu">—</strong></article><article>ETc<strong id="etc">—</strong></article></div><div class="panel" id="recommendation">Configurez la parcelle.</div></section><section id="config" hidden><h2>Configuration</h2><form onsubmit="saveConfig(event)" class="grid"><label>Parcelle<input id="name" value="Parcelle test"></label><label>Culture<input id="crop" value="Culture"></label><label>Surface (ha)<input id="area" type="number" step=".01" value="1"></label><label>CC (%)<input id="cc" type="number" value="30"></label><label>PFP (%)<input id="pfp" type="number" value="15"></label><label>Profondeur racinaire (mm)<input id="zr" type="number" value="400"></label><label>Coefficient p<input id="p" type="number" step=".01" value=".5"></label><label>Efficacité (%)<input id="eff" type="number" value="85"></label><label>Débit réel (m³/h)<input id="flow" type="number" value="10"></label><label>Mode<select id="mode"><option value="frequency">Fréquence</option><option value="rfu">RFU</option></select></label><label>Fréquence (jours)<input id="frequency" type="number" value="1"></label><button>Enregistrer</button></form></section><section id="daily" hidden><h2>Données quotidiennes</h2><form onsubmit="addDaily(event)" class="grid"><label>Date<input id="date" type="date"></label><label>ET₀ (mm/j)<input id="eto" type="number" step=".01" value="4.8"></label><label>Kc<input id="kc" type="number" step=".01" value="1"></label><label>Pluie (mm)<input id="rain" type="number" step=".01" value="0"></label><button>Calculer et enregistrer</button></form><div class="panel" id="result"></div></section><section id="history" hidden><h2>Historique</h2><table><thead><tr><th>Date</th><th>ETc</th><th>Pluie eff.</th><th>Déficit</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="js/app.js"></script></body></html>
